# Production stack: Nginx (SPA + TLS) -> Node API. Secrets come from ./.env (see .env.example).
name: notemind # fixed so volume names don't depend on the checkout directory
services:
  api:
    build:
      context: .
      target: server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1" # exactly one proxy (nginx) in front of the API
      DATABASE_PATH: /app/data/notemind.db
    volumes:
      - data:/app/data
      - ocr-cache:/tmp/notemind-ocr
    ports:
      - "127.0.0.1:3001:3001" # localhost only; public traffic goes through Cloudflare + nginx

  nginx:
    build:
      context: .
      target: web
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/ssl/cloudflare:ro # origin.pem + origin-key.pem (Cloudflare origin certificate)
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data: # SQLite database (+ WAL files)
  ocr-cache: # tesseract language data, downloaded on first OCR
