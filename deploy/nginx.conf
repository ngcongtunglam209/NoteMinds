# NoteMinds behind Cloudflare (Full strict, origin certificate).
# Serves the SPA from /usr/share/nginx/html and proxies /api to the Node server.
# Domain-agnostic (default_server), so it needs no per-deploy rendering.

upstream notemind_api {
    server api:3001;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# Trust Cloudflare edge IPs and use the real visitor IP (logs, rate limits, X-Forwarded-For).
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    server_tokens off;
    client_max_body_size 55m; # 50MB upload cap in the API + multipart overhead

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # No add_header inside locations below: it would drop these (nginx does not merge add_header levels).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Applies only where proxy_pass is used.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;

    root /usr/share/nginx/html;

    # Drop common exploit probes and dotfile requests.
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wordpress|setup/setup\.php|app_dev\.php|scripts/(deploy|db)\.sh|key\.pem|backup/database\.zip|install\.sql)$ {
        return 444;
    }
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Token-by-token chat responses: no buffering, no gzip, so chunks reach the browser immediately.
    location ~ ^/api/documents/[^/]+/chat$ {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass http://notemind_api;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=120 nodelay;
        proxy_pass http://notemind_api;
    }

    # Vite emits content-hashed files here.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # SPA: unknown paths render index.html; never cache it so new deploys are picked up.
    location / {
        expires epoch;
        try_files $uri /index.html;
    }
}
